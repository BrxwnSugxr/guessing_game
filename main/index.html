<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Guessing</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- stylesheet -->
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body class="bg-light">
    <!-- created a header -->
    <header class="bg-dark text-white text-center py-5">
      <div class="container">
        <h1 class="display-3 fw-bold">Word Guess Game</h1>
        <p class="lead mb-4">Test Your Skills</p>
        <button class="btn btn-warning btn-lg mt-3 start-button">Start</button>
      </div>
    </header>

    <!-- main Game -->
    <main class="container py-5">
      <div class="row g-4">
        <!-- word guess card -->
        <section class="col-12 col-lg-7">
          <div class="card shadow-sm h-100">
            <div
              class="card-body d-flex flex-coliumn justify-content-center align-items-center"
              style="min-height: 400px"
            >
              <h2 class="display-4 fw-bold word-blanks mb-4">
                J _ v _ S c r _ _ t
              </h2>
              <p>Type a letter to guess</p>
            </div>
          </div>
        </section>

        <!-- Start Game/Results card -->
        <section class="col-12 col-lg-5">
          <div class="card shadow h-100">
            <div class="card-body">
              <h2 class="h4 fw-bold mb-4">Game Stats</h2>
              <!-- wins and losses -->

              <div class="row g-3 mb-4">
                <div class="col-6">
                <div class="card text-center">
                  <div class="card-body">
                    <small class="text-secondary"> WINS </small>
                    <div class="display-6 fw-bold win">0</div>
                  </div>
                  </div>
                </div>

                <div class="col-6">
                <div class="card text-center">
                  <div class="card-body">
                    <small class="text-secondary"> LOSSES </small>
                    <div class="display-6 fw-bold win">0</div>
                  </div>
                  </div>
                </div>
                </div>
                


           
              
              <!-- Timer -->
              <div class="btn bg-dark text-white text-center">
                <div class="card-body py-5">
                  <div class="display-1 timer-count">10</div>
                  <h3>Seconds remaining</h3>
                </div>
              </div>
            </div>
            </div>
          </div>
        </section>
      </div>
    </main>
    

    <!-- JS -->
    <script src="assets/js/script.js"></script>
  </body>
</html>
