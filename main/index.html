<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Guessing</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- stylesheet -->
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body class="bg-light">
    <!-- created a header -->
    <header class="bg-dark text-white text-center py-5">
      <h1 class="display-3">Word Guess Game</h1>
      <button class="btn btn-warning btn-lg mt-3 start-button">Start</button>
    </header>

    <!-- main Game -->
    <main class="container py-5">
      <div class="row g-4">
        <!-- word guess card -->
        <section class="col-12 col-lg-7">
          <div class="card shadow h-100">
            <div
              class="card-body d-flex justify-content-center align-items-center"
              style="min-height: 400px"
            >
              <h2 class="display-4 word-blanks">J _ v _ S c r _ _ t</h2>
            </div>
          </div>
        </section>

        <!-- Results card -->
        <section class="col-12 col-lg-5">
          <div class="card shadow h-100">
            <div class="card-body">
              <!-- wins and losses -->
              <div
                class="d-flex justify-content-between align-items-center mb-4"
              >
                <div>
                  <h2>
                    Wins:
                    <span class="win">0</span>
                  </h2>
                  <h2>
                    Losses:
                    <span class="lose">0</span>
                  </h2>
                </div>
                <button class="btn btn-outline-danger reset-button">
                  Reset Score
                </button>
              </div>
              <!-- Timer -->
              <div class="btn bg-dark text-white text-center">
                <div class="card-body py-5">
                  <div class="display-1 timer-count">10</div>
                  <h3>Seconds remaining</h3>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- JS -->
    <script src="assets/js/script.js"></script>
  </body>
</html>
